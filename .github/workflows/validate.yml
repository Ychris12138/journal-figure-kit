name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helpers:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      MPLBACKEND: Agg
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test helpers
        run: python -m unittest discover -s tests -v
      - name: Render synthetic layout proof
        run: python examples/layout_proof.py --output build/layout
      - name: Package release candidate
        run: python tools/package_release.py --output build/dist
      - name: Install adapters in an isolated project
        run: python install.py --agent codex claude-code cursor gemini opencode copilot --scope project --project build/install-smoke
      - name: Check installed adapters
        run: python install.py --agent codex claude-code cursor gemini opencode copilot --scope project --project build/install-smoke --check
